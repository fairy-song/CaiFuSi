<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财赋思 - 连接诊断</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #f1c40f;
      padding-bottom: 10px;
    }
    .card {
      background-color: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .success {
      color: #27ae60;
    }
    .error {
      color: #e74c3c;
    }
    .warning {
      color: #f39c12;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background-color: #2980b9;
    }
    #results {
      margin-top: 20px;
      white-space: pre-wrap;
      font-family: monospace;
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>财赋思应用 - 连接诊断</h1>
  
  <div class="card">
    <h2>基本网络检查</h2>
    <p>点击按钮检查您的网络连接状态：</p>
    <button onclick="checkNetworkType()">检查网络类型</button>
    <button onclick="checkDnsLookup()">检查DNS解析</button>
  </div>
  
  <div class="card">
    <h2>应用连接测试</h2>
    <p>测试与财赋思应用的连接：</p>
    <input type="text" id="appUrl" placeholder="输入应用URL (如 https://xxx.cpolar.io)" style="width: 300px; padding: 8px; margin-right: 10px;">
    <button onclick="testAppConnection()">测试连接</button>
  </div>

  <div id="results">连接诊断结果将显示在这里...</div>

  <div class="card">
    <h2>常见问题解决方案</h2>
    <ul>
      <li><strong>移动数据无法访问</strong>：有些移动运营商可能限制了某些端口或非标准协议，尝试使用标准的HTTPS端口 (443) 或通过VPN访问。</li>
      <li><strong>DNS解析失败</strong>：尝试使用其他DNS服务器，如114.114.114.114或8.8.8.8。</li>
      <li><strong>连接超时</strong>：检查cpolar隧道是否仍在运行，或者尝试重新启动隧道。</li>
      <li><strong>SSL证书错误</strong>：确保使用https://而不是http://访问应用。</li>
    </ul>
  </div>

  <script>
    const resultsElement = document.getElementById('results');

    function log(message, type = 'info') {
      const now = new Date().toLocaleTimeString();
      resultsElement.innerHTML += `[${now}] [${type.toUpperCase()}] ${message}\n`;
      resultsElement.scrollTop = resultsElement.scrollHeight;
    }

    function checkNetworkType() {
      log('正在检查网络类型...');
      
      const connection = navigator.connection || 
                        navigator.mozConnection || 
                        navigator.webkitConnection;
      
      if (connection) {
        log(`网络类型: ${connection.type || '未知'}`, 'success');
        log(`有效网络类型: ${connection.effectiveType || '未知'}`, 'success');
        log(`下行速度: ${connection.downlink || '未知'} Mbps`, 'success');
        log(`RTT: ${connection.rtt || '未知'} ms`, 'success');
      } else {
        log('无法获取网络信息，您的浏览器可能不支持Network Information API', 'warning');
      }

      // 检测是否在移动网络上
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        log('检测到移动设备', 'info');
      } else {
        log('检测到桌面设备', 'info');
      }
    }

    function checkDnsLookup() {
      log('正在检查DNS解析能力...');
      
      // 测试一些常用域名
      const domains = ['baidu.com', 'qq.com', 'cpolar.com'];
      
      domains.forEach(domain => {
        const img = new Image();
        const startTime = Date.now();
        
        img.onload = function() {
          const elapsed = Date.now() - startTime;
          log(`${domain} 解析成功，耗时 ${elapsed}ms`, 'success');
        };
        
        img.onerror = function() {
          const elapsed = Date.now() - startTime;
          if (elapsed < 100) {
            log(`${domain} DNS可能被拦截，耗时 ${elapsed}ms`, 'warning');
          } else {
            log(`${domain} 解析失败或被拦截，耗时 ${elapsed}ms`, 'error');
          }
        };
        
        img.src = `https://${domain}/favicon.ico?t=${Date.now()}`;
      });
    }

    function testAppConnection() {
      const appUrl = document.getElementById('appUrl').value.trim();
      
      if (!appUrl) {
        log('请输入应用URL', 'error');
        return;
      }
      
      log(`正在测试连接到 ${appUrl}...`);
      
      fetch(appUrl, {
        method: 'HEAD',
        mode: 'no-cors', // 对于跨域请求必须设置
        cache: 'no-cache',
      })
      .then(() => {
        log(`成功连接到 ${appUrl}`, 'success');
      })
      .catch(error => {
        log(`连接到 ${appUrl} 失败: ${error.message}`, 'error');
        log('提示: 如果URL是https开头，可能是证书问题，请在浏览器中直接访问该URL确认证书。', 'warning');
      });
    }

    // 初始检查
    log('诊断工具已加载，可以开始检查');
  </script>
</body>
</html>
